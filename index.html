<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Thomas Aznar — Scénariste &amp; réalisateur</title>
<meta name="description" content="Thomas Aznar, scénariste et réalisateur : courts métrages et clips.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter+Tight:wght@400;500;600&display=swap">
<link rel="stylesheet" href="/style.css">
<script src="/config.js"></script>
</head>
<body>
<div class="wrap">
  <aside>
    <div style="display:flex;flex-direction:column;gap:8px">
      <a class="brand" href="#films" id="brandName">Thomas Aznar</a>
      <span class="tag" id="brandTag">Scénariste &amp; réalisateur</span>
    </div>
    <nav aria-label="Navigation principale">
      <a href="#films" data-route="films">Films</a>
      <a href="#qui-suis-je" data-route="qui-suis-je">Qui suis-je</a>
      <a href="#contact" data-route="contact">Contact</a>
    </nav>
  </aside>

  <main>
    <div id="loadNote" class="banner hidden"></div>

    <section id="view-films" class="hidden" aria-label="Films">
      <div class="filters" role="group" aria-label="Filtrer les films" id="filters"></div>
      <div class="films" id="filmList"></div>
      <footer class="site"><span class="copy">©</span><span class="city"></span></footer>
    </section>

    <section id="view-qui-suis-je" class="hidden">
      <div class="about">
        <div class="intro">
          <div class="portrait" id="portrait"><span>Portrait</span></div>
          <div class="bio">
            <h1 class="eyebrow">Qui suis-je</h1>
            <p class="accroche" id="accroche"></p>
            <div id="bioText" style="display:flex;flex-direction:column;gap:18px"></div>
          </div>
        </div>
        <section id="prizesBlock" aria-labelledby="prixT" style="display:flex;flex-direction:column;gap:28px">
          <h2 class="eyebrow" id="prixT">Prix &amp; sélections</h2>
          <div class="prizes" id="prizes"></div>
        </section>
        <section id="timelineBlock" aria-labelledby="parcT" style="display:flex;flex-direction:column;gap:28px">
          <h2 class="eyebrow" id="parcT">Parcours</h2>
          <ol class="timeline" id="timeline"></ol>
        </section>
        <footer class="site"><span class="copy">©</span><span class="city"></span></footer>
      </div>
    </section>

    <section id="view-contact" class="hidden">
      <div class="contact">
        <div style="flex:1 1 300px;display:flex;flex-direction:column;gap:24px">
          <h1 class="eyebrow">Contact</h1>
          <p class="serif" id="contactTitre" style="margin:0;font-size:clamp(32px,3.4vw,48px);line-height:1.15"></p>
          <div id="contactTexte" style="display:flex;flex-direction:column;gap:16px"></div>
          <p id="mailLine" class="hidden" style="margin:0;font-size:15px;color:var(--muted)">Ou directement par e-mail : <a id="mail" href="#"></a></p>
          <div class="socials" id="socials"></div>
        </div>
        <!-- Formulaire géré par Netlify Forms -->
        <form name="contact" method="POST" action="/" data-netlify="true" netlify-honeypot="bot-field" id="contactForm" style="flex:1.3 1 360px;display:flex;flex-direction:column;gap:18px;align-self:flex-start">
          <input type="hidden" name="form-name" value="contact">
          <p class="hp"><label>Ne pas remplir <input name="bot-field" tabindex="-1" autocomplete="off"></label></p>
          <div class="grid2">
            <label class="f">Nom<input class="inp" name="nom" autocomplete="name" required></label>
            <label class="f">E-mail<input class="inp" type="email" name="email" autocomplete="email" required></label>
          </div>
          <label class="f">Objet<input class="inp" name="objet" placeholder="Projet, collaboration, question…"></label>
          <label class="f">Message<textarea class="inp" name="message" rows="7" required></textarea></label>
          <div style="display:flex;flex-wrap:wrap;align-items:center;gap:16px">
            <button class="btn primary" type="submit" id="sendBtn">Envoyer</button>
            <span class="status" id="contactStatus" role="status" aria-live="polite"></span>
          </div>
        </form>
      </div>
      <footer class="site"><span class="copy">©</span><span class="city"></span></footer>
    </section>
  </main>
</div>

<div id="lightbox" class="lightbox hidden" role="dialog" aria-modal="true" aria-label="Lecture du film"></div>

<script>
(function(){
  "use strict";
  var CATS = { court:"Court métrage", clip:"Clip", doc:"Documentaire", pub:"Publicité", autre:"Autre" };
  var CATS_PL = { court:"Court métrage", clip:"Clips", doc:"Documentaires", pub:"Publicités", autre:"Autres" };
  var PLAY = '<svg aria-hidden="true" width="64" height="64" viewBox="0 0 72 72" fill="none"><circle cx="36" cy="36" r="35" stroke="#EDEAE3" stroke-width="1.5"/><path d="M30 25 L48 36 L30 47 Z" fill="#EDEAE3"/></svg>';
  var LAUREL = '<svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#E2C27A" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M8 21c-3-3-4-7-3-11"/><path d="M16 21c3-3 4-7 3-11"/><path d="M5 14c-1.5-.5-2.5-1.8-2.5-3.5 1.6 0 2.8.9 3.3 2.2"/><path d="M19 14c1.5-.5 2.5-1.8 2.5-3.5-1.6 0-2.8.9-3.3 2.2"/><path d="M6 8.5C5 7.4 4.8 6 5.5 4.6c1.2.8 1.6 2.2 1.2 3.5"/><path d="M18 8.5c1-1.1 1.2-2.5.5-3.9-1.2.8-1.6 2.2-1.2 3.5"/></svg>';
  var CFG = window.SITE_CONFIG || {};
  var D = { profil:{}, contact:{}, films:[], prix:[], parcours:[] };
  var filter = "all";

  function $(id){ return document.getElementById(id); }
  function esc(v){ return String(v == null ? "" : v).replace(/[&<>"']/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }
  function rawBase(){ return (CFG.owner && CFG.repo) ? "https://raw.githubusercontent.com/"+CFG.owner+"/"+CFG.repo+"/"+(CFG.branch||"main")+"/" : ""; }
  // Images : les chemins du dépôt sont lus depuis GitHub, pour que les nouvelles images s'affichent sans remise en ligne Netlify.
  function asset(p){
    p = String(p||"").trim(); if (!p) return "";
    if (/^https:\/\//i.test(p)) return p;
    if (/^(images\/)[\w\-./]+$/.test(p)) return (rawBase() || "/") + p;
    return "";
  }
  function link(u){ u=String(u||"").trim(); return /^https?:\/\//i.test(u) ? u : ""; }
  function paras(t){ return String(t||"").split(/\n\s*\n/).filter(function(s){ return s.trim(); }); }

  /* Vidéo : YouTube ou Vimeo intégrés */
  function embed(u){
    u = String(u||"");
    var m = u.match(/(?:youtube\.com\/(?:watch\?v=|embed\/|shorts\/)|youtu\.be\/)([\w-]{6,})/);
    if (m) return "https://www.youtube-nocookie.com/embed/"+m[1]+"?autoplay=1&rel=0";
    m = u.match(/vimeo\.com\/(?:video\/)?(\d+)/);
    if (m) return "https://player.vimeo.com/video/"+m[1]+"?autoplay=1";
    return "";
  }

  /* Navigation */
  var ROUTES = ["films","qui-suis-je","contact"];
  function route(){
    var h=(location.hash||"").replace("#",""); if (ROUTES.indexOf(h)<0) h="films";
    ROUTES.forEach(function(r){ $("view-"+r).classList.toggle("hidden", r!==h); });
    document.querySelectorAll("nav a[data-route]").forEach(function(a){ if(a.dataset.route===h) a.setAttribute("aria-current","page"); else a.removeAttribute("aria-current"); });
    window.scrollTo(0,0);
  }
  window.addEventListener("hashchange", route);

  /* Films */
  function films(){ return D.films.filter(function(f){ return f.publie !== false; }); }
  function renderFilters(){
    var cats=[]; films().forEach(function(f){ if(f.categorie && cats.indexOf(f.categorie)<0) cats.push(f.categorie); });
    var order=["court","clip","doc","pub","autre"]; cats.sort(function(a,b){ return order.indexOf(a)-order.indexOf(b); });
    if (filter!=="all" && cats.indexOf(filter)<0) filter="all";
    var h='<button type="button" data-f="all" aria-pressed="'+(filter==="all")+'">Tout</button>';
    cats.forEach(function(c){ h+='<button type="button" data-f="'+esc(c)+'" aria-pressed="'+(filter===c)+'">'+esc(CATS_PL[c]||c)+'</button>'; });
    $("filters").innerHTML = cats.length>1 ? h : "";
  }
  $("filters").addEventListener("click", function(e){ var b=e.target.closest("button[data-f]"); if(!b) return; filter=b.dataset.f; renderFilms(); });
  function metaLine(f){ var p=[]; if(f.artiste && f.categorie!=="court") p.push(f.artiste); if(f.annee) p.push(f.annee); if(f.sousTitre) p.push(f.sousTitre); return p.join(" · "); }
  function renderFilms(){
    renderFilters();
    var list=films().filter(function(f){ return filter==="all" || f.categorie===filter; });
    $("filmList").innerHTML = list.map(function(f){
      var img=asset(f.image);
      return '<article class="film"><button type="button" class="frame" data-open="'+esc(f.id)+'" aria-label="Lire '+esc(f.titre)+'">'+
        (img?'<img src="'+esc(img)+'" alt="" loading="lazy">':'')+'<div class="shade"></div><div class="play">'+PLAY+'</div>'+
        (f.mention?'<span class="badge">'+LAUREL+esc(f.mention)+'</span>':'')+'</button>'+
        '<div class="film-head"><h3 class="serif">'+esc(f.titre)+'</h3><span class="label">'+esc(CATS[f.categorie]||"")+'</span></div>'+
        '<p class="meta">'+esc(metaLine(f))+'</p></article>';
    }).join("");
  }
  $("filmList").addEventListener("click", function(e){ var b=e.target.closest("[data-open]"); if(b) openFilm(b.dataset.open,b); });

  var lastFocus=null;
  function openFilm(id, from){
    var f=D.films.filter(function(x){ return x.id===id; })[0]; if(!f) return; lastFocus=from;
    var src=embed(f.video), img=asset(f.image), url=link(f.video);
    var top=[CATS[f.categorie]||"", f.categorie!=="court"?f.artiste:"", f.annee, f.duree].filter(Boolean).join(" · ");
    var credits=(f.credits||[]).filter(function(c){ return c && (c.role||c.nom); });
    $("lightbox").innerHTML=
      '<button type="button" class="lb-close" id="lbClose" aria-label="Fermer"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 20 20" fill="none"><path d="M3 3 L17 17 M17 3 L3 17" stroke="#EDEAE3" stroke-width="1.6" stroke-linecap="round"/></svg></button>'+
      '<div class="lb-inner"><div class="player">'+
        (src ? '<iframe src="'+esc(src)+'" title="'+esc(f.titre)+'" allow="autoplay; fullscreen; picture-in-picture; encrypted-media" allowfullscreen></iframe>'
             : (img?'<img src="'+esc(img)+'" alt="">':'')+(url?'<div class="over"><a href="'+esc(url)+'" target="_blank" rel="noopener">Voir la vidéo</a></div>':''))+
      '</div><div class="lb-info"><div class="left"><h2 class="serif">'+esc(f.titre)+'</h2><span class="label" style="font-size:13px">'+esc(top)+'</span>'+
        (f.synopsis?'<p style="margin:8px 0 0;font-size:15px;line-height:1.7;color:#C9C5BC;max-width:46ch;white-space:pre-line">'+esc(f.synopsis)+'</p>':'')+
        (f.mention?'<span class="award">'+esc(f.mention)+'</span>':'')+'</div>'+
        (credits.length?'<dl class="credits">'+credits.map(function(c){ return '<div><dt>'+esc(c.role)+'</dt><dd>'+esc(c.nom)+'</dd></div>'; }).join("")+'</dl>':'')+
      '</div></div>';
    $("lightbox").classList.remove("hidden"); document.body.style.overflow="hidden"; $("lbClose").focus();
  }
  function closeFilm(){ $("lightbox").classList.add("hidden"); $("lightbox").innerHTML=""; document.body.style.overflow=""; if(lastFocus) lastFocus.focus(); }
  $("lightbox").addEventListener("click", function(e){ if(e.target.closest("#lbClose") || e.target===$("lightbox")) closeFilm(); });
  document.addEventListener("keydown", function(e){ if(e.key==="Escape" && !$("lightbox").classList.contains("hidden")) closeFilm(); });

  /* Qui suis-je */
  function renderAbout(){
    var p=D.profil;
    $("brandName").textContent=p.nom||""; $("brandTag").textContent=p.metier||"";
    document.title=(p.nom||"")+(p.metier?" — "+p.metier:"");
    document.querySelectorAll(".copy").forEach(function(el){ el.textContent="© "+new Date().getFullYear()+" "+(p.nom||""); });
    document.querySelectorAll(".city").forEach(function(el){ el.textContent=p.ville||""; });
    $("accroche").textContent=p.accroche||"";
    $("bioText").innerHTML=paras(p.bio).map(function(t){ return '<p class="txt">'+esc(t.trim())+'</p>'; }).join("");
    var por=asset(p.portrait);
    $("portrait").innerHTML = por ? '<img src="'+esc(por)+'" alt="Portrait de '+esc(p.nom)+'">' : '<span>Portrait</span>';
    $("prizesBlock").classList.toggle("hidden", !D.prix.length);
    $("prizes").innerHTML=D.prix.map(function(x){
      var lg=asset(x.logo);
      return '<div class="prize">'+(lg?'<div class="logo"><img src="'+esc(lg)+'" alt="'+esc(x.titre)+'"></div>':LAUREL.replace('width="14" height="14"','width="40" height="40"'))+
        '<span class="label" style="color:var(--gold);font-size:11px">'+esc([x.distinction,x.annee].filter(Boolean).join(" "))+'</span>'+
        '<span class="serif" style="font-size:28px;line-height:1.1">'+esc(x.titre)+'</span>'+
        '<span style="font-size:13px;color:var(--muted)">'+esc([x.detail,x.film].filter(Boolean).join(" · "))+'</span></div>';
    }).join("");
    $("timelineBlock").classList.toggle("hidden", !D.parcours.length);
    $("timeline").innerHTML=D.parcours.map(function(x){
      var lg=asset(x.logo);
      return '<li><span class="period">'+esc(x.periode)+'</span>'+(lg?'<span class="tl-logo"><img src="'+esc(lg)+'" alt=""></span>':'')+
        '<span class="what"><span class="serif" style="font-size:24px">'+esc(x.titre)+'</span><span style="font-size:14px;color:var(--muted)">'+esc(x.detail)+'</span></span></li>';
    }).join("");
  }

  /* Contact */
  function renderContact(){
    var p=D.profil, c=D.contact;
    $("contactTitre").textContent=c.titre||"";
    $("contactTexte").innerHTML=paras(c.texte).map(function(t){ return '<p style="margin:0;font-size:16px;line-height:1.75;color:#C9C5BC;max-width:56ch;white-space:pre-line">'+esc(t.trim())+'</p>'; }).join("");
    var show=!!(c.afficherEmail && p.email);
    $("mailLine").classList.toggle("hidden", !show);
    $("mail").textContent=p.email||""; $("mail").href=p.email?"mailto:"+p.email:"#";
    var soc=[["Instagram",p.instagram],["YouTube",p.youtube],["Vimeo",p.vimeo]].filter(function(s){ return link(s[1]); });
    $("socials").innerHTML=soc.map(function(s){ return '<a href="'+esc(link(s[1]))+'" target="_blank" rel="noopener">'+s[0]+'</a>'; }).join("");
  }
  $("contactForm").addEventListener("submit", function(e){
    e.preventDefault();
    var form=e.target, st=$("contactStatus");
    if (!form.checkValidity()){ form.reportValidity(); return; }
    $("sendBtn").disabled=true; st.className="status"; st.textContent="Envoi…";
    fetch("/", { method:"POST", headers:{"Content-Type":"application/x-www-form-urlencoded"}, body:new URLSearchParams(new FormData(form)).toString() })
      .then(function(r){ if(!r.ok) throw new Error(r.status); form.reset(); st.textContent="Merci, votre message a bien été envoyé."; })
      .catch(function(){ st.className="status err"; st.textContent="L'envoi n'a pas fonctionné. Réessayez dans un instant."; })
      .then(function(){ $("sendBtn").disabled=false; });
  });

  /* Chargement des contenus : d'abord depuis GitHub (toujours à jour), sinon la copie du site */
  function load(){
    var base=rawBase();
    var first = base ? fetch(base+"contenu.json?t="+Date.now(), {cache:"no-store"}).then(function(r){ if(!r.ok) throw 0; return r.json(); }) : Promise.reject();
    return first.catch(function(){ return fetch("/contenu.json", {cache:"no-cache"}).then(function(r){ if(!r.ok) throw 0; return r.json(); }); });
  }
  route();
  load().then(function(data){
    D.profil=data.profil||{}; D.contact=data.contact||{}; D.films=data.films||[]; D.prix=data.prix||[]; D.parcours=data.parcours||[];
    renderFilms(); renderAbout(); renderContact();
  }).catch(function(){
    $("loadNote").textContent="Les contenus n'ont pas pu être chargés. Rechargez la page dans un instant.";
    $("loadNote").classList.remove("hidden");
  });
})();
</script>
</body>
</html>
